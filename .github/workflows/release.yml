name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Install Python dependencies
        run: pip install -r requirements-runtime.txt

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Python backend binary
        working-directory: src-tauri
        run: pyinstaller job-one-stop-backend.spec --noconfirm

      - name: Copy backend binary to resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          if [ "${{ matrix.name }}" = "windows" ]; then
            cp src-tauri/dist/job-one-stop-backend.exe src-tauri/resources/job-one-stop-backend.exe
          else
            cp src-tauri/dist/job-one-stop-backend src-tauri/resources/job-one-stop-backend
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: "job-one-stop ${{ github.ref_name }}"
          releaseBody: "本地优先的个人求职助手。下载对应平台的安装包，双击即可运行。"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
