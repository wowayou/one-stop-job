name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-intel

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements-runtime.txt

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Python backend binary
        working-directory: src-tauri
        run: pyinstaller job-one-stop-backend.spec --noconfirm

      - name: Copy backend binary to resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          if [ "${{ matrix.name }}" = "windows" ]; then
            cp src-tauri/dist/job-one-stop-backend.exe src-tauri/resources/job-one-stop-backend.exe
          else
            cp src-tauri/dist/job-one-stop-backend src-tauri/resources/job-one-stop-backend
            chmod +x src-tauri/resources/job-one-stop-backend
          fi

      - name: Guard release payload against local credentials
        shell: bash
        run: bash scripts/release_secret_check.sh frontend/dist src-tauri/resources

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_FRONTEND_PATH: ${{ github.workspace }}/frontend
        with:
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: "job-one-stop ${{ github.ref_name }}"
          releaseBody: |
            job-one-stop ${{ github.ref_name }} 加入自动驾驶、三级求职面和完整首次使用引导。自动驾驶只在本地完成搜集、去重、分类、评分和材料准备；投递与招聘者沟通仍需用户确认。

            ${{ github.ref_name }} 同时修复 Tauri CLI 安装和 Tauri 前端构建路径问题。

            ## 本版重点
            - 自动驾驶每日扫描，首页和设置页均可开启、停止或立即扫描
            - 核心 / 相邻 / 探索三级求职面，按岗位族生成搜索计划并重评候选
            - 候选评分闸门、硬条件拦截和每日待确认上限，过滤结果保留审计摘要
            - 自动生成本地材料包：简历版本建议、投递理由、风险问题
            - 候选卡展示岗位族、能力重合、必要条件缺口和可补齐差距
            - 新增首次使用检查、产品导览、侧栏使用指南和完整操作手册
            - 写入个人看板时附带 JD 链接，并修复链接数字被误判为日期的问题

            ## 安全边界
            - 不自动投递
            - 不自动向招聘者发送消息
            - 不绕过验证码、风控页或平台限制

            ## 升级说明
            - 默认仍为“手动 + 核心”，升级后不会自行启动自动化
            - 无数据库迁移；原有岗位状态和个人看板不会被自动改变

            ## 安装说明
            - **Windows**: 下载 .msi 或 .exe，双击安装
            - **macOS**: 下载 .dmg，拖入 Applications（首次打开需右键 → 打开）
            - **Linux**: 下载 .AppImage，chmod +x 后双击运行
            > 首次启动可能提示"未知开发者"——这是正常的（未签名），按系统提示确认即可。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
