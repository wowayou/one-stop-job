# =============================================
# one-stop-job 本地 Web 助手配置
# 敏感信息只放 .env，不写入本文件。
# =============================================

# ==================== OpenCLI 配置 ====================
# Docker 模式下，主服务不直接调用 OpenCLI。
# BOSS / 智联建议在宿主机运行 tools/host_collect_*.bat 或 tools/host_collect_opencli.sh，
# 生成 CSV 后自动导入到 http://127.0.0.1:8000/api/jobs/import。
opencli:
  # 这里只保存无个人信息的平台命令模板，不保存个人机器路径或真实求职画像。
  # 使用前请把“示例岗位 / 示例市 / 8-20k”替换成自己的配置，并只保存在本机。
  # 宿主机脚本默认从 PATH 查找 opencli；找不到时可临时传 --opencli <path>。
  boss_cmd:
    - "opencli"
    - "boss"
    - "search"
    - "示例岗位"
    - "--city"
    - "示例市"
    - "--salary"
    - "8-20k"
    # - "--rest"
    # - "双休"
    - "--limit"
    - "200"
    - "--format"
    - "csv" # 关键修改：必须改为 csv，不能是 xlsx

  # 多关键词轮询（可选）：配了以后 boss_cmd 里 `search` 后面那个词会被逐个替换，
  # 跨关键词按 external_id 去重，单个关键词失败只进 report.skipped 不中断整批。
  # 一个岗位方向往往挂在多个标签下，单一关键词会漏掉大半岗位池。
  # boss_keywords:
  #   - "示例岗位A"
  #   - "示例岗位B"

  # WSL 提示：后端跑在 WSL、opencli 装在 Windows 时，boss_cmd 第一项要写
  # Windows 绝对路径（形如 <盘符>:\Users\<你的用户名>\AppData\Roaming\npm\opencli.cmd），
  # 后端会经 cmd.exe 代理调用；只写 "opencli" 在 WSL 里找不到命令。

  # liepin_cmd:
  #   - "opencli"
  #   - "liepin"
  #   - "search"
  #   - "--keyword"
  #   - "示例岗位"
  #   - "--city"
  #   - "示例市 OR 另一示例市"
  #   - "--salary"
  #   - "9000"
  #   - "--rest"
  #   - "双休"
  #   - "--limit"
  #   - "20"
  #   - "--format"
  #   - "csv"

# ==================== 扩展采集来源配置 ====================
# 新平台优先走配置化来源：kind=opencli_csv 代表宿主机调用 OpenCLI 并解析 CSV 输出。
# enabled=false 的模板不会运行，只作为配置入口。
job_sources:
  zhilian:
    enabled: false
    label: "智联招聘"
    kind: "opencli_csv"
    command:
      - "opencli"
      - "zhilian"
      - "search"
      - "示例岗位"
      - "--city"
      - "示例市"
      - "--salary"
      - "8-20k"
      - "--limit"
      - "100"
      - "--format"
      - "csv"

# ==================== 通用配置 ====================
general:
  data_dir: "./data/job_one_stop"     # SQLite 数据目录，本地数据不会提交

# ==================== 自动驾驶与求职相邻度 ====================
# 只自动搜集、去重、分类、评分和生成本地材料，最后仍需本人确认；不自动投递、不自动私信。
automation:
  mode: manual       # manual | autopilot
  daily_scan: true
  max_candidates_per_day: 30
  max_application_packs_per_day: 10

reach:
  level: core        # core | adjacent | exploratory
  rescore_existing: true
  max_queries_per_scan: 9
  # 个人岗位族请只在本机 config.yaml 覆盖；这里仅是通用空模板示意。
  # policy:
  #   - key: example_family
  #     label: 示例岗位族
  #     level: core
  #     search_terms: [示例岗位]
  #     keywords: [示例关键词]
  #     transferable: [示例可迁移能力]
  #     required: [示例必要条件]
  #     exclude: [示例排除项]

# ==================== 公司调研配置 ====================
research:
  source_allowlist:
    - "company_site"
    - "job_post"
    - "search"
    - "xhs"
    - "maimai"
    - "kanzhun"
    - "manual_note"

# ==================== 公众号 / 元宝渠道配置 ====================
# 岗位发现：招聘信息多发布在微信公众号；先用腾讯元宝（网页版）找出相关
# mp.weixin.qq.com 文章链接，再把链接/整段回答粘贴进「公众号导入」。
wechat:
  source_label: "公众号" # 入库时 Job.source 的取值
  fetch:
    enabled: true # 是否允许服务端自动抓取文章正文（关闭则只能手动粘正文）
    # 用移动端 UA 抓 mp.weixin 公开文章，单用户低频即可
    user_agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 MicroMessenger/8.0.49"
    rate_limit_seconds: 3 # 每次抓取之间的固定间隔，避免触发风控
    timeout_seconds: 20
  # 一篇文章正则抽到的岗位数 < 该值时，若 ai.enabled 再调用 LLM 兜底补抽
  min_jobs_before_llm_fallback: 1
  yuanbao_automation:
    enabled: false # 默认关闭：元宝网页自动化脆弱且涉 ToS/账号风险，opt-in
    user_data_dir: "./data/.yuanbao" # 持久化登录目录（一次性扫码后复用）
    prompt_template: |
      帮我找最近【请填写目标城市和目标岗位】相关的招聘公众号文章。
      只输出一个 JSON 数组，每项含 title 和 link 两个字段；
      link 必须是以 https://mp.weixin.qq.com/s 开头的公众号文章原文链接，不要任何解释或多余文字。

# ==================== beBee 渠道配置 ====================
# beBee 是实验来源：优先解析 schema.org JobPosting JSON-LD，
# 再尝试 Next/RSC jobs payload、microdata 和列表页可见卡片。
# 若采集结果为 0，通常是页面结构或外部 JS 接口渲染问题。
bebee:
  enabled: true
  source_label: "beBee"
  role_urls:
    - "https://example.com/jobs" # 合成示例；使用前仅在本机替换
  user_agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 Safari/604.1"
  rate_limit_seconds: 3 # 多个角色页之间的固定间隔,避免触发风控
  timeout_seconds: 20

# ==================== Telegram 入口（可选，默认关）====================
# 手机把岗位链接发给你的 Telegram bot → 后端长轮询拉取 → 抽链落盘 + 评分 → 回执给你自己。
# bot token 只进 .env（TELEGRAM_BOT_TOKEN）；这里只放开关与白名单。
# 回执里会带上按你的决策规则给出的初步建议（见 ingest.advice）；想直接追问就用
# ? / ？ / /ask 开头发消息，走的是和 Web 决策聊天同一条分析链路，回答同样只发给你自己。
# 红线边界：只处理 allowed_chat_id（你本人）的消息，回执也只发给你自己，绝不向招聘方发消息。
telegram:
  enabled: false
  allowed_chat_id: "" # 你本人的数字 Telegram chat id（整数或数字字符串均可）；留空则不启动轮询
  poll_timeout_seconds: 30 # 长轮询超时；后端主动出站拉取，无需暴露端口

# ==================== ingest 统一入口 ====================
# POST /api/ingest 与 Telegram 轮询共用。认识的链接走专用采集器（公众号/beBee），
# 残余文本/截图走 freeform LLM 抽取（覆盖 BOSS 等抓不到的平台）。
# manual_source 是 freeform 抽出的岗位入库时的 Job.source 标签。
ingest:
  manual_source: "manual" # 也可设成如 "手机粘贴" 以区分手机端来源
  # 识别到候选后，顺手按个人决策规则给一句「值不值得推进」（优先级/方向/下一步/先问什么）。
  # Web 显示在候选卡里，Telegram 直接写进回执——手机上不打开 Web 也能先有判断。
  # 只读判断，不改变「默认不入库」的口径；ai.enabled=false 时退化为规则模板结论。
  advice: true
  advice_max_candidates: 3 # 每条建议是一次独立模型调用；一次发来一堆岗位时只给前几个

# ==================== 匹配评分配置 ====================
# 权重合计不能超过 100（validate_weights 校验），维度名必须是已知的那 7 个。
# 注意：这里的 weights 只在**首次建画像**时当种子默认值；之后真正影响评分的是
# UserProfile.weights（改它走 PUT /api/profile 或 Web 匹配评分页）。
# 权重刻意向"有真实数据的维度"倾斜：role_match / salary_city 完全由岗位自带字段决定，
# 而 stability / reputation 在没有公司调研证据时只能取常量默认值——给它们高权重等于给
# 所有岗位同时加同一个数，只会压缩分数区间、让排序失去信息量。
scoring:
  weights:
    role_match: 40
    salary_city: 18
    growth: 12
    stability: 8
    reputation: 4
    commute_rest: 10
    interview_roi: 8

# ==================== 采集口径（跨来源） ====================
# 区域白名单：只作用于**采集器**路径（BOSS 定时/`/collect`、beBee、公众号）。
# CSV 导入、手动单条、Telegram 截图 ingest 都是你主动挑的输入，不受这里影响。
# 被挡掉的条数与前几条样例会记进 SourceRun.raw_config（Web 采集面板可查），不静默丢。
collect:
  area_filter:
    enabled: false
    cities: []            # 城市白名单；留空 = 不限城市
    areas: []             # 区白名单，如 [市北, 市南, 崂山]；留空 = 不限区（等于没开）
    # 「市南」「市南区」会归一后比对，两种写法都行。
    keep_unknown_area: true   # 解析不出区的岗位（公众号/beBee 常缺）默认放行：未知 ≠ 不符，
                              # 挡掉等于整批吃掉那两个来源。设 false 才连未知一起挡。

  # 候选闸门：评分之后按分数收窄「待筛」量，让漏斗逐级变小而不是原样堆到眼前。
  # 挡掉的条数与样例都会记进 SourceRun.raw_config，在 Web 采集面板可查（不静默丢数据）。
  score_gate:
    enabled: true
    min_score: 45         # 低于此分不进待筛。0 或 enabled:false = 关闭这道闸门
    max_pending: 15       # 单次最多挂多少条待筛，按分数取头部；0 = 不限量

# ==================== 跟进提醒配置 ====================
# fit/interview 状态超过 stale_days 天没有任何活动（状态变更/面试复盘/跟进任务）
# 时，会在冲刺包和「跟进任务」里高亮为“需跟进”。只提醒，不自动联系对方。
followup:
  stale_days: 5

# ==================== 定时任务 ====================
# 晨间日清单：解析个人看板「下一步」里的到期日期，按今日必发 / 跟进 / 收口三段汇总，
# 连同库内需跟进岗位与新入库岗位，经 Telegram 发给**本人**（红线 §2 机主回执豁免）。
# 依赖：telegram.enabled + TELEGRAM_BOT_TOKEN + 已配置的个人上下文仓库。
# 实现是应用进程内的 15 分钟轮询 + 状态文件（data_dir/daily_digest_state.json）：
# 到点未发才发、当天只发一次；发送时点机器没开机，则开机后一个周期内补发。
schedule:
  digest:
    enabled: false
    hour: 8
    minute: 20
    # true 时先跑一次 BOSS 采集再生成清单（每日一次，是 §3.3 低频人工触发的唯一例外）
    collect_first: false

# ==================== AI 配置 ====================
ai:
  enabled: true
  provider: "openai_compatible"
  timeout_seconds: 60 # 单次调用超时上限（秒）；超时会走既有的规则/模板回退，不会卡住请求
  # 密钥继续放 .env，例如 OPENAI_API_KEY / OPENAI_BASE_URL
  # providers（可选）：多 provider 自动容错。不填则回退到上面的单一 OPENAI_* 环境变量（现状）。
  # 按顺序尝试，前面失败（含超时/限流/鉴权失败）自动重试后再切下一个；全部失败才走规则/模板降级。
  # 密钥只进 .env，各 provider 用不同的 env 名，这里只写“去哪个 env 读”。
  # providers:
  #   - api_key_env: OPENAI_API_KEY        # 从该 env 读 key（必填，读不到就跳过这一项）
  #     base_url_env: OPENAI_BASE_URL      # 可选，从该 env 读 base_url
  #     model_env: OPENAI_MODEL            # 可选，从该 env 读 model；model_env 优先于下面的 model
  #     model: gemini-3.5-flash            # 可选，直接写死 model；都没有则回退 gpt-4o-mini
  #     timeout_seconds: 60                # 可选，覆盖上面的顶层 timeout_seconds
  #   - api_key_env: OPENAI_API_KEY_BACKUP
  #     base_url_env: OPENAI_BASE_URL_BACKUP
  #     model: gpt-4o-mini

# ==================== 升级发现 ====================
# 只做「发现 + 打开下载页」，**不下载、不安装、不重启**。一键更新需要代码签名与
# updater 公钥，属于后续阶段。唯一的出站动作是一次公开只读的 GitHub Releases GET，
# 不带凭据、不上传任何本地数据；关掉 enabled 就完全不发这个请求。
# 只识别正式 Release（draft / pre-release 一律跳过），版本按语义版本比较。
updates:
  enabled: true
  repo: "wowayou/one-stop-job"   # 发布仓库 owner/name
  check_on_startup: true          # 启动时静默检查一次；失败只在「关于」面板显示，不打扰主流程
  cache_ttl_hours: 6              # 成功结果的本地缓存时长；手动「检查更新」按钮绕过缓存
  timeout_seconds: 10
  # api_base: "https://api.github.com"   # 需要走镜像/自建静态清单时才改
